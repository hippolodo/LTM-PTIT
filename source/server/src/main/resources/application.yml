server:
  port: ${PORT:8081}
randomconnect:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  session-timeout-ms: ${SESSION_TIMEOUT_MS:45000}
logging:
  level:
    org.springframework.web.socket: WARN

spring:
  config:
    import: optional:file:./.env[.properties],optional:file:./source/server/.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:22489}/${DB_NAME:defaultdb}?sslMode=${DB_SSL_MODE:VERIFY_IDENTITY}&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 1
      connection-timeout: 5000
      initialization-fail-timeout: 10000
      data-source-properties:
        # Use Java trusted roots when no custom truststore URL is supplied.
        fallbackToSystemTrustStore: true
        trustCertificateKeyStoreUrl: ${DB_TRUSTSTORE_URL:}
        trustCertificateKeyStorePassword: ${DB_TRUSTSTORE_PASSWORD:}
        trustCertificateKeyStoreType: ${DB_TRUSTSTORE_TYPE:PKCS12}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_BYTES:10485760}
      max-request-size: 11MB
app:
  guest-ttl-hours: ${GUEST_TTL_HOURS:24}
  temporary-chat-hours: ${TEMPORARY_CHAT_HOURS:24}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    access-seconds: ${ACCESS_TOKEN_SECONDS:600}
