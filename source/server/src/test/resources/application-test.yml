spring:
  datasource:
    url: jdbc:h2:mem:randomconnect;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      data-source-properties: {}
  flyway:
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
JWT_SECRET: test-only-randomconnect-secret-with-at-least-32-bytes
